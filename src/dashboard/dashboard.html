<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Startup HTML</title>
        <link rel="icon" href="stockchart.jpg" />

        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="dashboard.css" />

         <!-- Include bootstrap CSS framework -->
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
        crossorigin="anonymous"
        />
    </head>
    <body class="bg-secondary">
        <header class="container-fluid">
            <nav class="navbar fixed-top navbar-dark bg-dark text-light">
                <a class="navbar-brand" href="#">Finance Dashboard </a>
                <menu class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Login</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="community.html">Community</a></li>
                </menu>
            </nav>
        </header>

        <main class="container-fluid bg-secondary text-left">
            <h2>Your Dashboard</h2>
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h4>Select Your Watchlist</h4>
                        <form>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="Consumer Price Index" name="CPI" value="yes">
                                <label class="form-check-label" for="Consumer Price Index">Display Consumer Price Index data</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="Federal Funds Rate" name="FEDFUNDS" value="yes">
                                <label class="form-check-label" for="Federal Funds Rate">Display Federal Funds Rate data</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="Apple" name="AAPL" value="yes">
                                <label class="form-check-label" for="Apple">Display Apple data</label>
                            </div>
                        </form>
                    
                </div>
                <div class="col-md-6"> 
                    <div id="picture" class="picture-box">
                        <img width="400px" height="200px" src="CPIfred.png" alt="random" /></div>
                </div> 
            </div>
        </main>

       <footer class="bg-dark text-white-50">
            <div class="container-fluid">
            <span class="text-reset">Author Name(s): HSH</span>
            <a class="text-reset" href="https://github.com/henhilt/startup/">GitHub</a>
            </div>
        </footer>
    </body>
</html>
