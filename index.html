<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Startup HTML</title>
        <link rel="icon" href="stockchart.jpg" />
        
        <link rel="stylesheet" href="main.css" />

         <!-- Include bootstrap CSS framework -->
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
        crossorigin="anonymous"
        />
    </head>

    <body class="bg-secondary">
        <header class="container-fluid">
            <nav class="navbar fixed-top navbar-dark bg-dark text-light">
                <a class="navbar-brand" href="#">Finance Dashboard </a>
                <menu class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Login</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="community.html">Community</a></li>
                </menu>
            </nav>
        </header>

        <main class="container-fluid bg-secondary text-center">
            <h3>Welcome to your personalized finance dashboard. </h3>
            <h5> Please login below. </h5>

            <form method="get" action="dashboard.html" class="mx-auto" style="max-width: 300px;">
                <div class="input-group mb-3">
                    <span class="input-group-text">Username:</span>
                    <input class="form-control" type="text" placeholder="user"/>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">Password:</span>
                    <input class="form-control" type="password" placeholder="*****"/>
                </div>
                <button class="btn btn-secondary" type="submit">Login</button>
                <button class="btn btn-secondary" type="submit">New User</button>
            </form>
            
        </main>

        <footer class="bg-dark text-white-50">
            <div class="container-fluid">
            <span class="text-reset">Author Name(s): HSH</span>
            <a class="text-reset" href="https://github.com/henhilt/startup/">GitHub</a>
            </div>
        </footer>
    </body>
</html>
